name: live-load
on:
  workflow_dispatch:
    inputs:
      http_threshold:
        description: "P99 budget (e.g. 250ms)"
        default: "250ms"

jobs:
  barrage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install barrage
        run: |
          curl -fsSL https://raw.githubusercontent.com/codetesla51/barrage/main/install.sh | bash -s -- --dir ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Wake the Render box + record RTT floor
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://gomax-ndql.onrender.com/healthz) && [ "$CODE" = "200" ] && break
            sleep 20
          done
          echo "--- RTT floor (static healthz, 5 hits) ---"
          for i in 1 2 3 4 5; do curl -s -o /dev/null -w "%{time_total}s\n" --max-time 20 https://gomax-ndql.onrender.com/healthz; done
          curl -s https://ipinfo.io/city || true

      - name: Capacity sweep (live, spread keys)
        run: |
          barrage run -c barrage/capacity-live.yaml \
            --http-threshold '${{ inputs.http_threshold }}' \
            --json live-gh.json --report live-gh.html

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrage-live
          path: |
            live-gh.json
            live-gh.html
